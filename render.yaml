# Blueprint de Render: crea la base PostgreSQL + el servicio web en un solo paso.
# Render > New > Blueprint > selecciona tu repositorio.
databases:
  - name: infrainv-db
    databaseName: infrainv
    user: infrainv
    plan: free            # cambia a un plan de pago para producción real

services:
  - type: web
    name: infrainv
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: infrainv-db
          property: connectionString   # URL interna: rápida y sin SSL
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@infrainv.com
      - key: ADMIN_PASSWORD
        generateValue: true            # visible en Environment tras el primer deploy
      - key: APP_TIMEZONE
        value: America/El_Salvador
      - key: SEED_DEMO
        value: "false"
